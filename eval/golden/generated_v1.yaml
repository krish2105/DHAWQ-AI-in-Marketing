provenance: "PARTIALLY independent, and the limit is worth stating precisely. The RULE determines which\
  \ constraint each brief probes, and the rules were written before the triage code and do not know it\
  \ exists. The TEMPLATE determines what is asked and therefore the expected outcome, and the templates\
  \ are hand-written. So this set no longer keys off the triage regexes \u2014 which was the point \u2014\
  \ but it is not free of its author. Two label errors found while building it (see the generator's comments)\
  \ are the evidence: an 'independent' set is only as independent as its labelling."
scored_separately_because: Blending these with the hand-written set would let a strong score on one hide
  a weak score on the other.
outcome_rule: A HARD rule asserts that a SLATE breaching it is rejected, not that a BRIEF touching the
  topic escalates. Most hard rules are constraints the optimiser simply enforces, so the expected outcome
  is a COMPLIANT SLATE. Only requests the system has no authority to fulfil refuse; only ones a person
  could authorise escalate.
