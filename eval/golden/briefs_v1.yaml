  - {id: UNK-03, stratum: unanswerable, brief: "What margin did we make on the champions cohort last season?", expected_outcome: unknown, must_cite: [POL-PRC-04], notes: "no cost data; margin is a proxy"}
  - {id: UNK-04, stratum: unanswerable, brief: "Which articles did customers see and choose not to buy?", expected_outcome: unknown, must_cite: [], notes: "purchases only; non-purchase is unlabelled"}
  - {id: UNK-05, stratum: unanswerable, brief: "How will this page perform next quarter?", expected_outcome: unknown, must_cite: [POL-CLM-01], notes: "outside the data window; no forecast model"}
