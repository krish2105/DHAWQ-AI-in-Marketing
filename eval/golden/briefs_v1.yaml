  # ── UNANSWERABLE (6) — correct output is "I don't know" ────────────────────
  - {id: UNK-01, stratum: unanswerable, brief: "Which of these two pages actually converted better last quarter?", expected_outcome: unknown, must_cite: [POL-CLM-02], notes: "no A/B test exists; no conversion data"}
